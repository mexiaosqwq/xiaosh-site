<h2>glass-a 页面太空了，想加什么方向的内容？</h2>
<p class="subtitle">先定大方向，再聊具体内容</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="projects" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>更多项目</h3>
      <p>再加几个项目卡片，填满右侧列</p>
    </div>
  </div>
  <div class="option" data-choice="about" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>关于我</h3>
      <p>加一段自我介绍，说说你是谁、做什么</p>
    </div>
  </div>
  <div class="option" data-choice="skills" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>技能标签</h3>
      <p>一排标签展示技术栈、兴趣领域</p>
    </div>
  </div>
  <div class="option" data-choice="activity" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>动态/日志</h3>
      <p>最近更新、正在做的事、博客片段</p>
    </div>
  </div>
</div>
