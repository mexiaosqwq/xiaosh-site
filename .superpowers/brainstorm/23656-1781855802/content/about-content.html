<h2>关于我 — 想写什么内容？</h2>
<p class="subtitle">选一个大概方向，或者告诉我你的想法</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="intro" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>简短自我介绍</h3>
      <p>"是一名独立开发者，热爱 Minecraft 和 AI" 之类的一两句话</p>
    </div>
  </div>
  <div class="option" data-choice="story" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>背景故事</h3>
      <p>怎么开始做开发的、为什么做模组汉化、做 mc-search-skill 的契机</p>
    </div>
  </div>
  <div class="option" data-choice="now" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>目前状态</h3>
      <p>正在做什么项目、最近在学什么、更新频率</p>
    </div>
  </div>
  <div class="option" data-choice="interests" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>兴趣标签</h3>
      <p>用一排 Tag 展示你的技能和兴趣，轻量不占空间</p>
    </div>
  </div>
</div>
