<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 - xiaosh.xyz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.container{max-width:500px;width:100%}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:48px;color:#776e65;font-weight:bold}
.scores{display:flex;gap:6px}
.score-box{background:#bbada0;color:#fff;padding:8px 16px;border-radius:4px;text-align:center;min-width:70px}
.score-label{font-size:10px;text-transform:uppercase;letter-spacing:1px}
.score-value{font-size:20px;font-weight:bold}
.new-game{background:#8f7a66;color:#fff;border:none;padding:10px 18px;border-radius:4px;font-size:14px;font-weight:bold;cursor:pointer}
.new-game:hover{background:#9f8b77}
.board{position:relative;background:#bbada0;border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;aspect-ratio:1;touch-action:none}
.tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:4px;transition:all .1s ease-in-out;font-size:clamp(16px,5vw,36px)}
.tile-0{background:#cdc1b4}
.tile-2{background:#eee4da;color:#776e65}
.tile-4{background:#ede0c8;color:#776e65}
.tile-8{background:#f2b179;color:#f9f6f2}
.tile-16{background:#f59563;color:#f9f6f2}
.tile-32{background:#f67c5f;color:#f9f6f2}
.tile-64{background:#f65e3b;color:#f9f6f2}
.tile-128{background:#edcf72;color:#f9f6f2;font-size:clamp(14px,4.5vw,32px)}
.tile-256{background:#edcc61;color:#f9f6f2;font-size:clamp(14px,4.5vw,32px)}
.tile-512{background:#edc850;color:#f9f6f2;font-size:clamp(14px,4.5vw,32px)}
.tile-1024{background:#edc53f;color:#f9f6f2;font-size:clamp(12px,3.8vw,28px)}
.tile-2048{background:#edc22e;color:#f9f6f2;font-size:clamp(12px,3.8vw,28px)}
.tile-super{background:#3c3a32;color:#f9f6f2;font-size:clamp(10px,3.2vw,24px)}
.game-over{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(238,228,218,0.73);display:flex;align-items:center;justify-content:center;border-radius:6px;z-index:10}
.game-over div{font-size:40px;font-weight:bold;color:#776e65;text-align:center}
.game-over button{margin-top:12px;font-size:16px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>2048</h1>
<div class="scores">
<div class="score-box"><div class="score-label">分数</div><div class="score-value" id="score">0</div></div>
<div class="score-box"><div class="score-label">最高</div><div class="score-value" id="best">0</div></div>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<span style="color:#776e65">合并数字，拼出 <strong>2048</strong>！</span>
<button class="new-game" onclick="init()">新游戏</button>
</div>
<div class="board" id="board">
<div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div>
<div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div>
<div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div>
<div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div><div class="tile tile-0"></div>
</div>
</div>
<script>
let grid=[],score=0,best=0;
function init(){
grid=Array(16).fill(0);score=0;
best=parseInt(localStorage.getItem('best2048'))||0;
document.getElementById('best').textContent=best;
document.getElementById('score').textContent=score;
addTile();addTile();render();
document.getElementById('board').style.opacity='1';
}
function addTile(){
let empty=grid.reduce((a,v,i)=>{if(!v)a.push(i);return a},[]);
if(empty.length)grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<0.9?2:4;
}
function render(){
let tiles=document.getElementById('board').querySelectorAll('.tile');
tiles.forEach((t,i)=>{
t.className='tile tile-'+grid[i];
if(grid[i]>2048)t.className='tile tile-super';
t.textContent=grid[i]||'';
});
document.getElementById('score').textContent=score;
if(score>best){best=score;localStorage.setItem('best2048',best);document.getElementById('best').textContent=best;}
}
function move(dir){
let moved=false,old=grid.slice();
let lines=[[],[],[],[]];
if(dir===0||dir===1)for(let r=0;r<4;r++){lines[r]=[];for(let c=0;c<4;c++)lines[r].push(r*4+c);}
else for(let c=0;c<4;c++){lines[c]=[];for(let r=0;r<4;r++)lines[c].push(r*4+c);}
lines.forEach(line=>{
let vals=line.map(i=>grid[i]).filter(v=>v);
if(dir===1||dir===3)vals.reverse();
let merged=[],skip=false;
for(let i=0;i<vals.length;i++){
if(!skip&&i<vals.length-1&&vals[i]===vals[i+1]){merged.push(vals[i]*2);score+=vals[i]*2;skip=true;}
else merged.push(vals[i]);skip=vals[i]!==vals[i+1]||!skip?false:skip;
}
while(merged.length<4)merged.push(0);
if(dir===1||dir===3)merged.reverse();
line.forEach((idx,i)=>{if(grid[idx]!==merged[i])moved=true;grid[idx]=merged[i];});
});
if(moved){addTile();render();if(isGameOver())showGameOver();}
}
function isGameOver(){
if(grid.some(v=>!v))return false;
for(let i=0;i<4;i++)for(let j=0;j<4;j++){
let val=grid[i*4+j];
if(j<3&&val===grid[i*4+j+1])return false;
if(i<3&&val===grid[(i+1)*4+j])return false;
}
return true;
}
function showGameOver(){
let board=document.getElementById('board');
let ov=document.createElement('div');ov.className='game-over';
ov.innerHTML='<div>游戏结束！<br><button class="new-game" onclick="init();this.parentElement.parentElement.remove()">再来一局</button></div>';
board.appendChild(ov);
}
let touchStartX=0,touchStartY=0;
document.getElementById('board').addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY});
document.getElementById('board').addEventListener('touchend',e=>{
let dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);
});
document.addEventListener('keydown',e=>{
let map={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,KeyA:0,KeyD:1,KeyW:2,KeyS:3};
if(map[e.code]!==undefined){e.preventDefault();move(map[e.code]);}
});
init();
</script>
</body>
</html>
