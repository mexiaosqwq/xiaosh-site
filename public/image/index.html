<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Host - xiaosh.xyz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: #f5f3f0;
  color: #2c2c2c;
  min-height: 100vh;
  padding: 2.5rem 1.5rem 4rem;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  max-width: 1200px;
  margin: 0 auto 1.2rem;
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #1a1a1a;
}
.header .subtitle {
  font-size: 0.85rem;
  color: #999;
  margin-top: 0.4rem;
  line-height: 1.6;
}
.header .count {
  font-size: 0.82rem;
  color: #aaa;
  margin-top: 0.5rem;
}

/* Upload Area */
.upload-area {
  max-width: 1200px;
  margin: 0 auto 1.5rem;
  border: 2px dashed #ddd;
  border-radius: 14px;
  padding: 2rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.25s, background 0.25s;
  background: rgba(255,255,255,0.5);
}
.upload-area:hover {
  border-color: #bbb;
  background: rgba(255,255,255,0.7);
}
.upload-area.dragover {
  border-color: #7c3aed;
  background: rgba(124,58,237,0.06);
}
.upload-area .upload-icon {
  font-size: 1.8rem;
  margin-bottom: 0.4rem;
}
.upload-area .upload-text {
  font-size: 0.9rem;
  color: #666;
  font-weight: 500;
}
.upload-area .upload-hint {
  font-size: 0.78rem;
  color: #aaa;
  margin-top: 0.25rem;
}
.upload-area.uploading {
  pointer-events: none;
  opacity: 0.6;
}

.upload-progress {
  max-width: 1200px;
  margin: 0 auto 0.8rem;
  display: none;
  flex-direction: column;
  gap: 0.4rem;
}
.upload-progress.active {
  display: flex;
}
.upload-progress .progress-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.82rem;
  color: #666;
  padding: 0.3rem 0.6rem;
  background: rgba(255,255,255,0.6);
  border-radius: 8px;
}
.upload-progress .progress-item .name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upload-progress .progress-item .status {
  flex-shrink: 0;
  font-weight: 500;
}
.upload-progress .progress-item .status.done {
  color: #2e7d32;
}
.upload-progress .progress-item .status.error {
  color: #c62828;
}

/* Grid */
.grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
}

/* Card */
.card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
  position: relative;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
}

.card .thumb-wrap {
  position: relative;
  width: 100%;
  padding-bottom: 100%;
  overflow: hidden;
  background: #f0eeeb;
}
.card .thumb-wrap img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}
.card:hover .thumb-wrap img {
  transform: scale(1.05);
}

.card .card-body {
  padding: 0.55rem 0.7rem 0.6rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.card .filename {
  flex: 1;
  font-size: 0.72rem;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.card-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.card .copy-btn {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 8px;
  background: #f0eeeb;
  color: #666;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
}
.card .copy-btn:hover {
  background: #e5e3e0;
  color: #333;
}
.card .copy-btn.copied {
  background: #d4edda;
  color: #155724;
}

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 2rem;
}
.lightbox.active {
  display: flex;
}

.lightbox .close-btn {
  position: absolute;
  top: 1.2rem;
  right: 1.5rem;
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 2rem;
  cursor: pointer;
  transition: color 0.2s;
  line-height: 1;
}
.lightbox .close-btn:hover {
  color: #fff;
}

.lightbox img {
  max-width: 90vw;
  max-height: 75vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
}

.lightbox .lb-actions {
  margin-top: 1.2rem;
  display: flex;
  gap: 0.8rem;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.lightbox .lb-actions button {
  padding: 0.55rem 1.4rem;
  border: none;
  border-radius: 10px;
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.lightbox .lb-copy {
  background: #fff;
  color: #2c2c2c;
}
.lightbox .lb-copy:hover {
  background: #f0eeeb;
}
.lightbox .lb-copy.copied {
  background: #d4edda;
  color: #155724;
}

.lightbox .lb-delete {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
}
.lightbox .lb-delete:hover {
  background: #e53935;
  color: #fff;
}

.lightbox .lb-close-text {
  color: rgba(255,255,255,0.5);
  font-size: 0.8rem;
  cursor: pointer;
}
.lightbox .lb-close-text:hover {
  color: rgba(255,255,255,0.8);
}

.lightbox .lb-time {
  color: rgba(255,255,255,0.5);
  font-size: 0.78rem;
  margin-top: 0.6rem;
  text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #2c2c2c;
  color: #fff;
  padding: 0.6rem 1.4rem;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  z-index: 2000;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Loading & Error */
.loading, .error, .empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 0;
  font-size: 0.95rem;
  color: #999;
}
.error { color: #c0392b; }
.empty { color: #bbb; }

/* Confirm dialog */
.confirm-overlay {
  display: none;
  position: fixed;
  z-index: 3000;
  inset: 0;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}
.confirm-overlay.active {
  display: flex;
}
.confirm-box {
  background: #fff;
  border-radius: 16px;
  padding: 1.8rem 2rem 1.5rem;
  max-width: 360px;
  width: 90%;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.confirm-box p {
  font-size: 0.95rem;
  color: #2c2c2c;
  margin-bottom: 1.2rem;
  line-height: 1.5;
}
.confirm-box .confirm-actions {
  display: flex;
  gap: 0.6rem;
  justify-content: center;
}
.confirm-box button {
  padding: 0.5rem 1.5rem;
  border: none;
  border-radius: 10px;
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.2s;
}
.confirm-box .btn-cancel {
  background: #f0eeeb;
  color: #666;
}
.confirm-box .btn-cancel:hover {
  background: #e5e3e0;
}
.confirm-box .btn-confirm {
  background: #e53935;
  color: #fff;
}
.confirm-box .btn-confirm:hover {
  background: #c62828;
}

/* Responsive — tablet */
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
}

/* Responsive — mobile portrait */
@media (max-width: 700px) {
  body { padding: 0.6rem 0.4rem 1.5rem; }

  .header { margin-bottom: 0.5rem; padding: 0 0.2rem; }
  .header h1 { font-size: 1.1rem; }
  .header .subtitle { font-size: 0.7rem; margin-top: 0.2rem; }
  .header .count { font-size: 0.7rem; margin-top: 0.2rem; }

  .grid { grid-template-columns: repeat(2, 1fr); gap: 3px; }

  .card { border-radius: 6px; box-shadow: none; }
  .card:hover { transform: none; box-shadow: none; }

  .card .thumb-wrap { padding-bottom: 100%; }
  .card .thumb-wrap img { object-fit: cover; }
  .card:hover .thumb-wrap img { transform: none; }

  /* Overlay copy button on image */
  .card .card-body {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0.35rem 0.4rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.4));
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 0 0 6px 6px;
  }
  .card .filename { display: none; }
  .card .copy-btn {
    width: 30px; height: 30px;
    font-size: 0.8rem;
    border-radius: 7px;
    background: rgba(255,255,255,0.8);
    color: #444;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .card .copy-btn:hover { background: rgba(255,255,255,0.95); }
  .card .copy-btn:active { transform: scale(0.92); }

  .upload-area {
    margin-bottom: 0.6rem;
    padding: 0.7rem 0.8rem;
    border-radius: 10px;
    border-width: 1.5px;
  }
  .upload-area .upload-icon { font-size: 1.1rem; margin-bottom: 0.15rem; }
  .upload-area .upload-text { font-size: 0.78rem; }
  .upload-area .upload-hint { font-size: 0.65rem; margin-top: 0.15rem; }

  .upload-progress { margin-bottom: 0.4rem; }
  .upload-progress .progress-item {
    font-size: 0.7rem;
    padding: 0.2rem 0.4rem;
    gap: 0.4rem;
  }

  .lightbox { padding: 0.3rem; }
  .lightbox img {
    max-width: 100vw;
    max-height: 65vh;
    border-radius: 4px;
  }
  .lightbox .close-btn {
    top: 0.4rem;
    right: 0.5rem;
    font-size: 1.6rem;
    color: rgba(255,255,255,0.8);
  }
  .lightbox .lb-actions {
    gap: 0.5rem;
    margin-top: 0.6rem;
    width: 100%;
    max-width: 320px;
  }
  .lightbox .lb-actions button {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
    border-radius: 10px;
    min-height: 44px;
  }
  .lightbox .lb-close-text {
    display: none;
  }
  .lightbox .lb-time {
    font-size: 0.7rem;
    margin-top: 0.4rem;
  }

  /* Mobile close hint */
  .lightbox .lb-actions .lb-close-text {
    display: flex;
    flex: none;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 0;
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.2s;
  }
  .lightbox .lb-actions .lb-close-text::before {
    content: '✕';
    font-size: 1.2rem;
  }
  .lightbox .lb-actions .lb-close-text:active {
    background: rgba(255,255,255,0.1);
  }

  .toast {
    bottom: 1rem;
    font-size: 0.78rem;
    padding: 0.45rem 1rem;
    border-radius: 8px;
  }

  .confirm-box {
    padding: 1.2rem 1.2rem 1rem;
    border-radius: 14px;
  }
  .confirm-box p { font-size: 0.85rem; }
  .confirm-box button {
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    min-height: 44px;
  }

  .loading, .error, .empty {
    padding: 2rem 0;
    font-size: 0.8rem;
  }
}

/* Very small screens */
@media (max-width: 380px) {
  body { padding: 0.4rem 0.3rem 1rem; }
  .grid { gap: 2px; }
  .header h1 { font-size: 1rem; }
  .card .copy-btn { width: 28px; height: 28px; font-size: 0.75rem; }
  .upload-area { padding: 0.5rem 0.6rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📦 图床</h1>
  <p class="subtitle">点击图片查看大图 · 点击复制按钮获取直链 · 素材来源于网络</p>
  <p class="count" id="count">加载中...</p>
</div>

<!-- Upload Area -->
<div class="upload-area" id="uploadArea">
  <div class="upload-icon">📁</div>
  <div class="upload-text">点击上传图片</div>
  <div class="upload-hint">支持 PNG / JPG / GIF / WebP，可多选</div>
</div>
<input type="file" id="fileInput" multiple accept="image/*" style="display:none">

<!-- Upload Progress -->
<div class="upload-progress" id="uploadProgress"></div>

<!-- Image Grid -->
<div class="grid" id="grid">
  <div class="loading">加载中...</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close-btn" id="lbClose">&times;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-time" id="lbTime"></div>
  <div class="lb-actions">
    <button class="lb-copy" id="lbCopy">📋 复制链接</button>
    <button class="lb-delete" id="lbDelete">🗑️ 删除</button>
    <span class="lb-close-text" id="lbCloseText">ESC 关闭</span>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg">确定要删除这张图片吗？</p>
    <div class="confirm-actions">
      <button class="btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-confirm" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCopy = document.getElementById('lbCopy');
  const lbDelete = document.getElementById('lbDelete');
  const lbClose = document.getElementById('lbClose');
  const lbCloseText = document.getElementById('lbCloseText');
  const lbTime = document.getElementById('lbTime');
  const toast = document.getElementById('toast');
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const uploadProgress = document.getElementById('uploadProgress');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');

  const base = window.location.origin;

  let currentFilename = '';
  let currentUploadTime = '';
  let confirmCallback = null;

  // ===== Time formatting =====
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const month = pad(d.getMonth() + 1);
    const day = pad(d.getDate());
    const hour = pad(d.getHours());
    const min = pad(d.getMinutes());
    if (d.getFullYear() === now.getFullYear()) {
      return `${month}-${day} ${hour}:${min}`;
    }
    return `${d.getFullYear()}-${month}-${day}`;
  }

  // ===== Toast =====
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ===== Copy =====
  function copyUrl(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => showToast('✅ 已复制链接')).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(url) {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('✅ 已复制链接'); } catch(e) { showToast('❌ 复制失败'); }
    document.body.removeChild(ta);
  }

  // ===== Confirm Dialog =====
  function showConfirm(msg, callback) {
    confirmMsg.textContent = msg;
    confirmCallback = callback;
    confirmOverlay.classList.add('active');
  }
  function hideConfirm() {
    confirmOverlay.classList.remove('active');
    confirmCallback = null;
  }
  confirmCancel.addEventListener('click', hideConfirm);
  confirmOk.addEventListener('click', function() {
    if (confirmCallback) confirmCallback();
    hideConfirm();
  });
  confirmOverlay.addEventListener('click', function(e) {
    if (e.target === confirmOverlay) hideConfirm();
  });

  // ===== Load Images =====
  function loadImages() {
    grid.innerHTML = '<div class="loading">加载中...</div>';
    count.textContent = '加载中...';

    fetch('/api/images')
      .then(r => {
        if (!r.ok) throw new Error('Failed to load');
        return r.json();
      })
      .then(files => {
        if (!files || files.length === 0) {
          grid.innerHTML = '<div class="empty">暂无图片，点击上方区域上传</div>';
          count.textContent = '共 0 张图片';
          return;
        }

        count.textContent = `共 ${files.length} 张图片`;
        grid.innerHTML = '';

        files.forEach(f => {
          const fileName = f.name || f;
          const url = base + '/image/' + encodeURIComponent(fileName);

          const card = document.createElement('div');
          card.className = 'card';

          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';

          const img = document.createElement('img');
          img.src = url;
          img.alt = fileName;
          img.loading = 'lazy';
          thumbWrap.appendChild(img);

          const body = document.createElement('div');
          body.className = 'card-body';

          const info = document.createElement('div');
          info.className = 'card-info';

          const fn = document.createElement('span');
          fn.className = 'filename';
          fn.title = fileName;
          fn.textContent = fileName;

          info.appendChild(fn);

          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = '📋';
          btn.title = '复制链接';
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            copyUrl(url);
            this.classList.add('copied');
            setTimeout(() => this.classList.remove('copied'), 1200);
          });

          body.appendChild(info);
          body.appendChild(btn);

          card.addEventListener('click', function() {
            currentFilename = fileName;
            currentUploadTime = f.uploaded || '';
            lbImg.src = url;
            lbImg.alt = fileName;
            lbTime.textContent = formatTime(currentUploadTime);
            lbCopy.textContent = '📋 复制链接';
            lbCopy.classList.remove('copied');
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
          });

          card.appendChild(thumbWrap);
          card.appendChild(body);
          grid.appendChild(card);
        });
      })
      .catch(err => {
        grid.innerHTML = '<div class="error">❌ 加载失败，请刷新重试</div>';
        count.textContent = '加载失败';
        console.error(err);
      });
  }

  // ===== Upload =====
  function uploadFiles(files) {
    if (files.length === 0) return;

    uploadProgress.innerHTML = '';
    uploadProgress.classList.add('active');
    uploadArea.classList.add('uploading');

    let completed = 0;
    const total = files.length;

    Array.from(files).forEach(file => {
      const item = document.createElement('div');
      item.className = 'progress-item';
      item.innerHTML = `<span class="name">${file.name}</span><span class="status">上传中...</span>`;
      uploadProgress.appendChild(item);
      const statusEl = item.querySelector('.status');

      const formData = new FormData();
      formData.append('file', file);

      fetch('/api/upload', { method: 'POST', body: formData })
        .then(r => {
          if (!r.ok) throw new Error('Upload failed');
          return r.json();
        })
        .then(data => {
          statusEl.textContent = '✅';
          statusEl.className = 'status done';
          completed++;
          if (completed === total) {
            uploadArea.classList.remove('uploading');
            setTimeout(() => {
              uploadProgress.classList.remove('active');
              uploadProgress.innerHTML = '';
            }, 1500);
            loadImages();
          }
        })
        .catch(err => {
          statusEl.textContent = '❌';
          statusEl.className = 'status error';
          completed++;
          if (completed === total) {
            uploadArea.classList.remove('uploading');
          }
        });
    });
  }

  uploadArea.addEventListener('click', function() {
    fileInput.click();
  });

  fileInput.addEventListener('change', function() {
    if (this.files.length > 0) {
      uploadFiles(this.files);
      this.value = '';
    }
  });

  // Drag & Drop
  uploadArea.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
  });
  uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      uploadFiles(e.dataTransfer.files);
    }
  });

  // ===== Lightbox =====
  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { lbImg.src = ''; }, 200);
  }

  lbClose.addEventListener('click', closeLightbox);
  lbCloseText.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      closeLightbox();
    }
  });
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) closeLightbox();
  });

  lbCopy.addEventListener('click', function() {
    if (currentFilename) {
      const url = base + '/image/' + encodeURIComponent(currentFilename);
      copyUrl(url);
      this.textContent = '✅ 已复制';
      this.classList.add('copied');
      setTimeout(() => { this.textContent = '📋 复制链接'; this.classList.remove('copied'); }, 2000);
    }
  });

  lbDelete.addEventListener('click', function() {
    if (!currentFilename) return;
    showConfirm('确定要删除这张图片吗？', function() {
      fetch('/api/images?name=' + encodeURIComponent(currentFilename), { method: 'DELETE' })
        .then(r => {
          if (!r.ok) throw new Error('Delete failed');
          showToast('🗑️ 已删除');
          closeLightbox();
          loadImages();
        })
        .catch(err => {
          showToast('❌ 删除失败');
        });
    });
  });

  // ===== Init =====
  loadImages();
})();
</script>
</body>
</html>
